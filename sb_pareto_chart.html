<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Pareto Chart</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; padding: 24px; }

  .container { max-width: 1100px; margin: 0 auto; }

  h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; }

  .upload-zone {
    border: 2px dashed #c0c0c0;
    border-radius: 12px;
    background: #fff;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 20px;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: #3b82f6; background: #eff6ff; }
  .upload-zone input { display: none; }
  .upload-icon { font-size: 36px; margin-bottom: 10px; }
  .upload-text { font-size: 15px; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .upload-hint { font-size: 12px; color: #9ca3af; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #111; }
  .stat-sub { font-size: 11px; color: #6b7280; margin-top: 2px; }

  .chart-card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    padding: 20px 24px 24px;
    margin-bottom: 20px;
  }
  .chart-title { font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 16px; }

  .chart-wrapper { position: relative; width: 100%; }

  .table-card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }
  .table-header { padding: 14px 20px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; justify-content: space-between; }
  .table-title { font-size: 14px; font-weight: 600; color: #374151; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f9fafb; padding: 10px 16px; text-align: left; font-weight: 600; color: #6b7280; border-bottom: 1px solid #f3f4f6; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  td { padding: 10px 16px; border-bottom: 1px solid #f9fafb; color: #374151; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }
  .ppm-bar { display: flex; align-items: center; gap: 8px; }
  .ppm-bar-fill { height: 8px; border-radius: 4px; background: #3b82f6; min-width: 2px; }
  .cumulative-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: #dbeafe;
    color: #1d4ed8;
  }
  .cumulative-badge.high { background: #fef3c7; color: #92400e; }
  .cumulative-badge.critical { background: #fee2e2; color: #991b1b; }

  .empty-state { text-align: center; padding: 48px 24px; color: #9ca3af; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .legend { display: flex; gap: 20px; margin-bottom: 12px; font-size: 12px; color: #6b7280; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Software Bin (SB) Pareto Chart</h1>
  <p class="subtitle">上傳 CSV 檔案，自動分析各 SB bin 的 ppm 分佈與柏拉圖</p>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept=".csv">
    <div class="upload-icon">📂</div>
    <div class="upload-text">點擊選擇 CSV 檔案，或拖曳至此處</div>
    <div class="upload-hint">支援標準 CSV 格式，需含 SB 欄位</div>
  </div>

  <div id="content" style="display:none;">
    <div class="stats-row" id="statsRow"></div>

    <div class="chart-card">
      <div class="chart-title">SB 柏拉圖 — PPM 分佈與累積百分比</div>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:#3b82f6;"></span>各 SB PPM (左軸)</span>
        <span class="legend-item"><span class="legend-dot" style="background:#f59e0b; border-radius:50%;"></span>累積百分比 (右軸)</span>
      </div>
      <div class="chart-wrapper" id="chartWrapper">
        <canvas id="paretoChart" role="img" aria-label="SB Software Bin Pareto Chart"></canvas>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <span class="table-title">SB 明細表</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>SB</th>
            <th>Count</th>
            <th>PPM</th>
            <th>PPM 佔比</th>
            <th>累積 %</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="icon">⚠️</div>
    <p id="emptyMsg">找不到 SB 欄位，請確認 CSV 格式</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let chartInstance = null;

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
});

function processFile(file) {
  const reader = new FileReader();
  reader.onload = e => parseCSV(e.target.result, file.name);
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text, filename) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return showError('CSV 檔案為空');

  const headers = lines[0].split(',').map(h => h.trim());
  const sbIndex = headers.findIndex(h => h.toUpperCase() === 'SB');
  if (sbIndex === -1) return showError('找不到 SB 欄位，請確認 CSV 標頭包含 "SB"');

  const hbIndex = headers.findIndex(h => h.toUpperCase() === 'HB');

  const sbCounts = {};
  let totalRows = 0;
  let failRows = 0;

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');
    if (cols.length <= sbIndex) continue;
    const sbVal = cols[sbIndex].trim();
    if (sbVal === '' || sbVal === 'SB') continue;
    const sbNum = parseInt(sbVal);
    if (isNaN(sbNum)) continue;

    totalRows++;

    if (sbNum === 1) continue; // pass bin

    failRows++;
    sbCounts[sbNum] = (sbCounts[sbNum] || 0) + 1;
  }

  if (totalRows === 0) return showError('CSV 中沒有有效的資料列');

  renderChart(sbCounts, totalRows, failRows, filename);
}

function renderChart(sbCounts, totalRows, failRows, filename) {
  document.getElementById('content').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';

  const sorted = Object.entries(sbCounts)
    .map(([sb, count]) => ({ sb: parseInt(sb), count }))
    .sort((a, b) => b.count - a.count);

  const totalFail = sorted.reduce((s, d) => s + d.count, 0);
  const passCount = totalRows - totalFail;
  const passRate = ((passCount / totalRows) * 100).toFixed(2);
  const totalPPM = Math.round((totalFail / totalRows) * 1e6);

  const labels = sorted.map(d => `SB ${d.sb}`);
  const ppms = sorted.map(d => Math.round((d.count / totalRows) * 1e6));
  const cumPct = [];
  let cumSum = 0;
  ppms.forEach(p => { cumSum += p; cumPct.push(+((cumSum / totalPPM) * 100).toFixed(1)); });

  const maxBar = Math.max(...ppms);
  const barHeight = Math.max(320, labels.length * 44 + 80);

  document.getElementById('chartWrapper').style.height = barHeight + 'px';

  if (chartInstance) chartInstance.destroy();

  const ctx = document.getElementById('paretoChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'PPM',
          data: ppms,
          backgroundColor: ppms.map((p, i) => {
            const pct = cumPct[i - 1] || 0;
            if (pct >= 80) return '#fca5a5';
            if (pct >= 50) return '#93c5fd';
            return '#3b82f6';
          }),
          borderColor: 'transparent',
          borderRadius: 4,
          yAxisID: 'y',
          order: 2,
        },
        {
          type: 'line',
          label: '累積 %',
          data: cumPct,
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245,158,11,0.12)',
          borderWidth: 2.5,
          pointBackgroundColor: '#f59e0b',
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: false,
          tension: 0.3,
          yAxisID: 'y2',
          order: 1,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.dataset.label === 'PPM') return ` PPM: ${ctx.parsed.y.toLocaleString()}`;
              return ` 累積: ${ctx.parsed.y}%`;
            }
          }
        },
        annotation: {}
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 12 }, color: '#6b7280', autoSkip: false },
        },
        y: {
          position: 'left',
          title: { display: true, text: 'PPM', color: '#6b7280', font: { size: 12 } },
          ticks: {
            color: '#6b7280',
            font: { size: 11 },
            callback: v => v.toLocaleString()
          },
          grid: { color: 'rgba(0,0,0,0.05)' },
          suggestedMax: Math.ceil(maxBar * 1.15),
          min: 0,
        },
        y2: {
          position: 'right',
          title: { display: true, text: '累積 %', color: '#f59e0b', font: { size: 12 } },
          min: 0,
          max: 100,
          ticks: {
            color: '#f59e0b',
            font: { size: 11 },
            callback: v => v + '%'
          },
          grid: { drawOnChartArea: false },
        }
      }
    }
  });

  // Stats
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">總測試顆數</div>
      <div class="stat-value">${totalRows.toLocaleString()}</div>
      <div class="stat-sub">Total Dies</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pass (SB1)</div>
      <div class="stat-value">${passCount.toLocaleString()}</div>
      <div class="stat-sub">Yield ${passRate}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Fail 顆數</div>
      <div class="stat-value">${failRows.toLocaleString()}</div>
      <div class="stat-sub">${sorted.length} 個 Fail Bins</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">總 Fail PPM</div>
      <div class="stat-value">${totalPPM.toLocaleString()}</div>
      <div class="stat-sub">parts per million</div>
    </div>
  `;

  // Table
  let cumPPM = 0;
  const tbody = sorted.map((d, i) => {
    const ppm = ppms[i];
    const pct = cumPct[i];
    cumPPM += ppm;
    const barW = Math.round((ppm / maxBar) * 180);
    const badgeClass = pct >= 80 ? 'critical' : pct >= 50 ? 'high' : '';
    return `<tr>
      <td style="color:#9ca3af;">${i + 1}</td>
      <td><strong>SB ${d.sb}</strong></td>
      <td>${d.count.toLocaleString()}</td>
      <td>${ppm.toLocaleString()}</td>
      <td><div class="ppm-bar"><div class="ppm-bar-fill" style="width:${barW}px;"></div><span style="font-size:11px;color:#9ca3af;">${((ppm/totalPPM)*100).toFixed(1)}%</span></div></td>
      <td><span class="cumulative-badge ${badgeClass}">${pct}%</span></td>
    </tr>`;
  }).join('');
  document.getElementById('tableBody').innerHTML = tbody;

  uploadZone.querySelector('.upload-text').textContent = `✅ 已載入: ${filename}`;
  uploadZone.querySelector('.upload-hint').textContent = `${totalRows.toLocaleString()} 筆資料 · 點擊可重新上傳`;
}

function showError(msg) {
  document.getElementById('content').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('emptyMsg').textContent = msg;
}
</script>
</body>
</html>
